aid: clanbeat
name: Clanbeat
description: >-
  Clanbeat is an Estonian education-technology company whose app supports student
  and staff well-being by nurturing social and emotional learning (SEL) through
  co-creation. The platform provides well-being tracking, quality reflections,
  meaningful connections between students and educators, and tools to co-create
  SEL curriculum. It is used by international schools, educators, students, and
  fitness and lifelong-learning communities to evidence group emotional well-being
  and bring classes closer together. Clanbeat is delivered as a hosted web and
  mobile application at app.clanbeat.com; it publishes no public developer API,
  OpenAPI, SDKs, or partner integration surface at this time.
